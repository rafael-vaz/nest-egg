<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- charset -->
    <meta charset="UTF-8" />
    <!-- author -->
    <meta name="author" content="Rafael Vaz" />
    <!-- seo -->
    <meta
      name="description"
      content="Nest Egg é uma ferramenta de finanças pessoais que permite definir e priorizar metas financeiras, monitorar seu progresso, registrar transações, configurar recorrências e acompanhar seu histórico financeiro de forma prática e organizada."
    />
    <!-- responsive settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- theme -->
    <meta name="color-scheme" content="dark" />

      property="og:image"
      content="https://nest-egg.vercel.app/img/thumb.jpg"

    <!-- favicon -->
    <link
      rel="icon"
      type="image/svg+xml"

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
